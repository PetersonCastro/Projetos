<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CursoEmVideo</title>
    <link rel="stylesheet" href="ex002.css">
</head>
<body>
    <h1>Pergunta</h1>
    <script>
        //janela da alerta
        window.alert("Olá, Mundo!");
        //janela de confirmação
        window.confirm("Deseja continuar?");
        //Variável e janela de pergunta
        var nome = window.prompt("Qual é o seu nome?");
        //Exibindo o nome na tela
        window.alert("Olá, " + nome + "!");
        
    </script>
</body>
</html>
